<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史申报库 - 个税填报服务</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6fa; overflow-x: hidden; }
        .container { max-width: 1800px; }
        .card { margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .table-responsive { max-height: 500px; overflow-y: auto; }
        .sticky-top { background: #fff; }
        .nav-link.active { font-weight: 600; }
        .badge-warn { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; border-radius: 4px; padding: 4px 8px; }
        table.w-100 td, table.w-100 th { overflow: hidden; }
        #summaryTable, #detailsTable { table-layout: fixed; }
        .ellipsis-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
        .nowrap { white-space: nowrap; }
        .num-cell { text-align: right; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container" style="max-width: 1800px;">
        <span class="navbar-brand">个税填报服务</span>
    </div>
</nav>

<div class="container py-3" style="max-width: 1800px;">
    <div class="d-flex gap-2 mb-3 flex-wrap">
        <a href="/" class="btn btn-outline-primary">报税数据生成</a>
        <a href="/tax-return" class="btn btn-outline-primary">报税状态统计</a>
        <a href="/payroll-records" class="btn btn-outline-primary">工资发放情况查询</a>
        <a href="/personnel-compare" class="btn btn-outline-success">增减员比对</a>
        <a href="/special-units" class="btn btn-outline-primary">特殊结算单元配置</a>
        <a href="/filing-history" class="btn btn-primary active">历史申报库</a>
    </div>

    <div class="card">
        <div class="card-header"><strong>申报文件导入</strong></div>
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">申报文件（税款计算/正常工资薪金/劳务报酬/全年一次性奖金，可多选）</label>
                    <input type="file" id="filingFiles" class="form-control" accept=".xls,.xlsx,.csv" multiple>
                </div>
                <div class="col-md-2">
                    <button id="btnImport" class="btn btn-primary w-100">导入</button>
                </div>
                <div class="col-md-6">
                    <span id="importMsg" class="badge-warn"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header"><strong>申报汇总（月份 × 所得项目类型）</strong></div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm table-striped table-hover mb-0 w-100" id="summaryTable">
                    <thead class="sticky-top">
                        <tr id="summaryHead"></tr>
                    </thead>
                    <tbody id="summaryTbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <strong>申报明细</strong>
            <div class="d-flex gap-2">
                <select id="monthFilter" class="form-select form-select-sm" style="width:auto;">
                    <option value="">+全部月份</option>
                </select>
                <select id="typeFilter" class="form-select form-select-sm" style="width:auto;">
                    <option value="">全部类型</option>
                </select>
                <input type="text" id="searchFilter" class="form-control form-control-sm" placeholder="姓名/证件号/工号" style="width:200px;">
                <button id="btnFilter" class="btn btn-sm btn-outline-primary">查询</button>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm table-striped table-hover mb-0 w-100" id="detailsTable">
                    <thead class="sticky-top">
                        <tr>
                            <th style="width:40px"></th><th style="width:50px">序号</th><th style="width:80px">姓名</th><th style="width:180px">证件号码</th><th style="width:90px">工号</th>
                            <th style="width:80px">月份</th><th style="width:110px">类型</th><th style="width:110px">本期收入</th><th style="width:90px">免税</th>
                            <th style="width:100px">三险一金合计</th><th style="width:100px">已缴税额</th><th style="width:100px">应补退</th><th>备注</th>
                        </tr>
                    </thead>
                    <tbody id="detailsTbody"></tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2">
                <span id="detailsCount" class="text-muted"></span>
                <div class="d-flex gap-2 align-items-center">
                    <label class="form-label mb-0 small">每页</label>
                    <select id="detailsPageSize" class="form-select form-select-sm" style="width:auto;">
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                    </select>
                    <button id="detailsPrev" class="btn btn-sm btn-outline-secondary">上一页</button>
                    <span class="small" id="detailsPageInfo"></span>
                    <button id="detailsNext" class="btn btn-sm btn-outline-secondary">下一页</button>
                    <input type="number" id="detailsJump" class="form-control form-control-sm" style="width:70px" min="1" placeholder="页码">
                    <button id="detailsJumpBtn" class="btn btn-sm btn-outline-primary">跳页</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const filingFiles = document.getElementById('filingFiles');
    const importMsg = document.getElementById('importMsg');
    const monthFilter = document.getElementById('monthFilter');
    const typeFilter = document.getElementById('typeFilter');
    const searchFilter = document.getElementById('searchFilter');
    let detailsTotal = 0;
    let detailsPage = 1;
    let detailsLoading = false;

    document.addEventListener('DOMContentLoaded', async () => {
        await loadSummary();
        queryRecords();
    });

    async function loadSummary() {
        try {
            const resp = await fetch('/api/filing/summary');
            const data = await resp.json();
            if (data.error) { console.error(data.error); return; }
            const groups = data.groups || [];
            renderSummary(groups);
            buildFilters(groups);
        } catch (e) {
            console.error(e);
        }
    }

    function renderSummary(groups) {
        const months = [...new Set(groups.map(g => g.month))].sort((a, b) => a - b);
        const types = [...new Set(groups.map(g => g.item_type))];
        const map = {};
        groups.forEach(g => {
            map[g.month] = map[g.month] || {};
            map[g.month][g.item_type] = g.count;
        });
        document.getElementById('summaryHead').innerHTML =
            '<th style="width:90px">月份</th>' + types.map(t => `<th>${t}</th>`).join('') + '<th style="width:90px">合计</th>';
        document.getElementById('summaryTbody').innerHTML = months.map(m => {
            const row = map[m] || {};
            const total = types.reduce((s, t) => s + (row[t] || 0), 0);
            return `<tr><td>${m}</td>` + types.map(t => `<td class="num-cell">${row[t] || 0}</td>`).join('') +
                `<td class="num-cell"><strong>${total}</strong></td></tr>`;
        }).join('') || '<tr><td colspan="3" class="text-center text-muted py-3">暂无数据，请先导入申报文件</td></tr>';
    }

    function buildFilters(groups) {
        const months = [...new Set(groups.map(g => g.month))].sort((a, b) => a - b);
        const types = [...new Set(groups.map(g => g.item_type))];
        monthFilter.innerHTML = '<option value="">+全部月份</option>' +
            months.map(m => `<option value="${m}">${m}</option>`).join('');
        typeFilter.innerHTML = '<option value="">全部类型</option>' +
            types.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    document.getElementById('btnImport').addEventListener('click', async () => {
        if (!filingFiles.files.length) { importMsg.textContent = '请先选择申报文件'; return; }
        const fd = new FormData();
        for (const f of filingFiles.files) fd.append('files', f);
        importMsg.textContent = '导入中...';
        try {
            const resp = await fetch('/api/filing/import', { method: 'POST', body: fd });
            const data = await resp.json();
            if (data.error) { importMsg.textContent = '导入失败: ' + data.error; return; }
            const parts = data.files.map(f => {
                const base = `${f.filename} (${f.item_type || '未知类型'}, ${f.count}条)`;
                return f.error ? `${base} 失败: ${f.error}` : base;
            });
            importMsg.textContent = `导入成功 ${data.total} 条: ${parts.join('; ')}`;
            filingFiles.value = '';
            await loadSummary();
            detailsPage = 1;
            queryRecords();
        } catch (e) {
            importMsg.textContent = '导入失败: ' + e.message;
        }
    });

    document.getElementById('btnFilter').addEventListener('click', () => { detailsPage = 1; queryRecords(); });
    searchFilter.addEventListener('keydown', e => { if (e.key === 'Enter') { detailsPage = 1; queryRecords(); } });

    function pageSize() {
        return parseInt(document.getElementById('detailsPageSize').value) || 50;
    }

    async function queryRecords() {
        if (detailsLoading) return;
        detailsLoading = true;
        const month = monthFilter.value;
        const type = typeFilter.value;
        const search = searchFilter.value.trim();
        const ps = pageSize();
        const url = `/api/filing/records?page=${detailsPage}&page_size=${ps}` +
            (month ? '&month=' + month : '') +
            (type ? '&item_type=' + encodeURIComponent(type) : '') +
            (search ? '&search=' + encodeURIComponent(search) : '');
        const tbody = document.getElementById('detailsTbody');
        tbody.innerHTML = '<tr><td colspan="13" class="text-center text-muted py-3">加载中...</td></tr>';
        try {
            const resp = await fetch(url);
            const data = await resp.json();
            if (data.error) {
                tbody.innerHTML = `<tr><td colspan="13" class="text-center text-danger py-3">${data.error}</td></tr>`;
                return;
            }
            detailsTotal = data.total;
            renderDetails(data.records || []);
        } finally {
            detailsLoading = false;
        }
    }

    function fmt(v) {
        return v === null || v === undefined || v === '' ? '' : Number(v).toLocaleString();
    }

    function renderDetails(records) {
        const ps = pageSize();
        const totalPages = Math.max(1, Math.ceil(detailsTotal / ps));
        const start = (detailsPage - 1) * ps;
        document.getElementById('detailsTbody').innerHTML = records.map((d, i) => {
            const insurance = (d.pension || 0) + (d.medical || 0) + (d.unemployment || 0) + (d.housing || 0);
            const sub = `
                <tr class="raw-sub" style="display:none; background:#f8f9fa;">
                    <td></td><td colspan="12" style="text-align:left;">
                        养老 ${fmt(d.pension)} ｜ 医疗 ${fmt(d.medical)} ｜ 失业 ${fmt(d.unemployment)} ｜ 公积金 ${fmt(d.housing)} ｜
                        累计已缴税 ${fmt(d.tax_accum)} ｜ 导入时间 ${d.import_time || ''} ｜ 来源文件 ${d.source_file || ''}
                    </td>
                </tr>`;
            return `
            <tr class="raw-row">
                <td><button class="btn btn-sm btn-outline-primary py-0 px-1" onclick="toggleRaw(this)" title="展开原始字段">+</button></td>
                <td>${start + i + 1}</td><td>${d.name}</td><td class="nowrap">${d.cert_no}</td><td>${d.emp_no || ''}</td>
                <td>${d.month}</td><td>${d.item_type}</td>
                <td class="num-cell">${fmt(d.income)}</td><td class="num-cell">${fmt(d.tax_free)}</td>
                <td class="num-cell">${fmt(insurance)}</td><td class="num-cell">${fmt(d.tax_paid)}</td><td class="num-cell">${fmt(d.tax_due)}</td>
                <td class="ellipsis-cell" title="${(d.remark || '').replace(/"/g, '&quot;')}">${d.remark || ''}</td>
            </tr>${sub}`;
        }).join('') || '<tr><td colspan="13" class="text-center text-muted py-3">暂无数据</td></tr>';
        document.getElementById('detailsCount').textContent = `共 ${detailsTotal} 条`;
        document.getElementById('detailsPageInfo').textContent = `第 ${detailsPage}/${totalPages} 页`;
        document.getElementById('detailsPrev').disabled = detailsPage <= 1;
        document.getElementById('detailsNext').disabled = detailsPage * ps >= detailsTotal;
    }

    function toggleRaw(btn) {
        const row = btn.closest('tr');
        const sub = row.nextElementSibling;
        if (!sub || !sub.classList.contains('raw-sub')) return;
        const shown = sub.style.display === 'table-row';
        sub.style.display = shown ? 'none' : 'table-row';
        btn.textContent = shown ? '+' : '-';
        btn.title = shown ? '展开原始字段' : '收起原始字段';
    }

    document.getElementById('detailsPrev').addEventListener('click', () => { if (detailsPage > 1) { detailsPage--; queryRecords(); } });
    document.getElementById('detailsNext').addEventListener('click', () => { if (detailsPage * pageSize() < detailsTotal) { detailsPage++; queryRecords(); } });
    document.getElementById('detailsJumpBtn').addEventListener('click', () => {
        const totalPages = Math.max(1, Math.ceil(detailsTotal / pageSize()));
        const p = parseInt(document.getElementById('detailsJump').value);
        if (!p || p < 1 || p > totalPages) { alert(`页码需在 1-${totalPages} 之间`); return; }
        detailsPage = p;
        queryRecords();
    });
    document.getElementById('detailsPageSize').addEventListener('change', () => { detailsPage = 1; queryRecords(); });
</script>
</body>
</html>
