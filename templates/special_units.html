<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特殊结算单元配置 - 个税填报服务</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6fa; }
        .container { max-width: 1800px; }
        .card { margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        #errorBox { display: none; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container" style="max-width: 1800px;">
        <span class="navbar-brand">个税填报服务</span>
    </div>
</nav>

<div class="container py-3" style="max-width: 1800px;">
    <div class="d-flex gap-2 mb-3 flex-wrap">
        <a href="/" class="btn btn-outline-primary">报税数据生成</a>
        <a href="/tax-return" class="btn btn-outline-primary">报税状态统计</a>
        <a href="/personnel-compare" class="btn btn-success">增减员比对</a>
        <a href="/special-units" class="btn btn-primary active">特殊结算单元配置</a>
    </div>

    <div class="card">
        <div class="card-header"><strong>特殊结算单元配置</strong></div>
        <div class="card-body">
            <div class="alert alert-info" style="font-size: 0.9rem;">
                两种排除模式：
                <strong>工资为0不增员不报税</strong> — 该结算单元当月合计工资为0时人员不增员不报税（有工资仍增员报税）；
                <strong>完全排除不增员不报税</strong> — 该结算单元不论是否发工资，都不增员不报个税（从根源排除）。
            </div>
            <div class="row g-2 align-items-end mb-3">
                <div class="col-md-4">
                    <label class="form-label">结算单元代码</label>
                    <input type="number" id="unitCode" class="form-control" placeholder="如 41137">
                </div>
                <div class="col-md-4">
                    <label class="form-label">结算单元名称</label>
                    <input type="text" id="unitName" class="form-control" placeholder="如 吉林大学第二医院B">
                </div>
                <div class="col-md-2">
                    <div class="form-check mt-4">
                        <input class="form-check-input" type="checkbox" id="excludeAll">
                        <label class="form-check-label" for="excludeAll">完全排除（不增员不报个税）</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <button id="btnAdd" class="btn btn-primary w-100">新增配置</button>
                </div>
            </div>
            <div class="d-flex gap-2 mb-2 flex-wrap">
                <button id="btnUnitList" class="btn btn-outline-info btn-sm">下载结算单元代码对照表</button>
                <button id="btnTemplate" class="btn btn-outline-warning btn-sm">下载导入模板</button>
                <button id="btnExport" class="btn btn-outline-success btn-sm">导出配置 Excel</button>
                <button id="btnImport" class="btn btn-outline-primary btn-sm">导入配置 Excel</button>
                <input type="file" id="importFile" accept=".xlsx" style="display:none">
                <span id="importMsg" class="text-muted align-self-center" style="font-size:0.85rem;"></span>
            </div>
            <div class="text-muted mb-2" style="font-size: 0.85rem;">
                导入提示：第一列填结算单元名称（代码可留空，系统自动匹配）；支持导入模板 3 列格式或导出文件 4 列格式。
            </div>
            <div id="errorBox" class="alert alert-danger mt-2"></div>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th style="width:50px;">序号</th>
                        <th>结算单元代码</th>
                        <th>结算单元名称</th>
                        <th>工资为0不增员不报税</th>
                        <th>完全排除不增员不报税</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="unitList"></tbody>
            </table>
            <div id="emptyState" class="text-muted text-center py-3">暂无配置</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const unitCode = document.getElementById('unitCode');
    const unitName = document.getElementById('unitName');
    const excludeAll = document.getElementById('excludeAll');
    const btnAdd = document.getElementById('btnAdd');
    const btnExport = document.getElementById('btnExport');
    const btnImport = document.getElementById('btnImport');
    const btnUnitList = document.getElementById('btnUnitList');
    const btnTemplate = document.getElementById('btnTemplate');
    const importFile = document.getElementById('importFile');
    const importMsg = document.getElementById('importMsg');
    const errorBox = document.getElementById('errorBox');
    const unitList = document.getElementById('unitList');
    const emptyState = document.getElementById('emptyState');

    function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
    function hideError() { errorBox.style.display = 'none'; }

    async function loadUnits() {
        try {
            const resp = await fetch('/api/special-units');
            if (!resp.ok) throw new Error('加载失败');
            const data = await resp.json();
            const units = data.units || [];
            emptyState.style.display = units.length === 0 ? 'block' : 'none';
            unitList.innerHTML = units.map((u, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${u.code}</td>
                    <td>${u.name}</td>
                    <td>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" ${u.zero_salary_no_add ? 'checked' : ''} onchange="toggleZero(${u.code}, this.checked)">
                        </div>
                    </td>
                    <td>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" ${u.exclude_all ? 'checked' : ''} onchange="toggleMode(${u.code}, this.checked)">
                        </div>
                    </td>
                    <td><button class="btn btn-sm btn-outline-danger" onclick="deleteUnit(${u.code})">删除</button></td>
                </tr>`).join('');
        } catch (e) {
            showError(`加载配置失败: ${e.message}`);
        }
    }

    async function toggleMode(code, checked) {
        await toggleField(code, { exclude_all: checked });
    }

    async function toggleZero(code, checked) {
        await toggleField(code, { zero_salary_no_add: checked });
    }

    async function toggleField(code, payload) {
        try {
            const resp = await fetch(`/api/special-units/${code}/mode`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await resp.json();
            if (!resp.ok || data.error) { showError(data.error || '切换失败'); loadUnits(); return; }
            hideError();
        } catch (e) { showError(`切换失败: ${e.message}`); loadUnits(); }
    }

    async function deleteUnit(code) {
        try {
            const resp = await fetch(`/api/special-units/${code}`, { method: 'DELETE' });
            const data = await resp.json();
            if (!resp.ok || data.error) { showError(data.error || '删除失败'); return; }
            hideError();
            loadUnits();
        } catch (e) { showError(`删除失败: ${e.message}`); }
    }

    btnAdd.addEventListener('click', async function() {
        hideError();
        const code = unitCode.value.trim();
        if (!code) { showError('请填写结算单元代码'); return; }
        try {
            const resp = await fetch('/api/special-units', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ unit_code: parseInt(code), unit_name: unitName.value.trim(), exclude_all: excludeAll.checked })
            });
            const data = await resp.json();
            if (!resp.ok || data.error) { showError(data.error || '新增失败'); return; }
            unitCode.value = '';
            unitName.value = '';
            excludeAll.checked = false;
            loadUnits();
        } catch (e) { showError(`新增失败: ${e.message}`); }
    });

    btnExport.addEventListener('click', async function() {
        hideError();
        try {
            const resp = await fetch('/api/special-units/export');
            const data = await resp.json();
            if (!resp.ok || data.error) { showError(data.error || '导出失败'); return; }
            window.location.href = data.download_url;
        } catch (e) { showError(`导出失败: ${e.message}`); }
    });

    btnUnitList.addEventListener('click', async function() {
        hideError();
        try {
            const resp = await fetch('/api/special-units/unit-list-export');
            const data = await resp.json();
            if (!resp.ok || data.error) { showError(data.error || '下载失败'); return; }
            window.location.href = data.download_url;
        } catch (e) { showError(`下载失败: ${e.message}`); }
    });

    btnTemplate.addEventListener('click', async function() {
        hideError();
        try {
            const resp = await fetch('/api/special-units/template');
            const data = await resp.json();
            if (!resp.ok || data.error) { showError(data.error || '下载失败'); return; }
            window.location.href = data.download_url;
        } catch (e) { showError(`下载失败: ${e.message}`); }
    });

    btnImport.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', async function() {
        const file = importFile.files[0];
        if (!file) return;
        hideError();
        importMsg.textContent = '导入中...';
        try {
            const form = new FormData();
            form.append('file', file);
            const resp = await fetch('/api/special-units/import', { method: 'POST', body: form });
            const data = await resp.json();
            if (!resp.ok || data.error) { showError(data.error || '导入失败'); importMsg.textContent = ''; return; }
            importMsg.textContent = `已导入 ${data.count} 条配置` + (data.skipped && data.skipped.length ? `；跳过 ${data.skipped.length} 条: ${data.skipped.join('、')}` : '');
            importFile.value = '';
            loadUnits();
        } catch (e) { showError(`导入失败: ${e.message}`); importMsg.textContent = ''; }
    });

    document.addEventListener('DOMContentLoaded', loadUnits);
</script>
</body>
</html>
