<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报税状态统计 - 个税填报服务</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6fa; overflow-x: hidden; }
        .container { max-width: 1800px; }
        .card { margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .stat-card { text-align: center; padding: 1rem; }
        .stat-card .num { font-size: 1.8rem; font-weight: 700; }
        .stat-ok { color: #198754; }
        .stat-warn { color: #fd7e14; }
        .stat-danger { color: #dc3545; }
        .stat-info { color: #0d6efd; }
        .status-ok { color: #198754; font-weight: 600; }
        .status-diff { color: #fd7e14; font-weight: 600; }
        .status-no { color: #dc3545; font-weight: 600; }
        .status-other { color: #6c757d; font-weight: 600; }
        .table-responsive { max-height: 500px; overflow-y: auto; }
        .sticky-top { background: #fff; }
        .nav-link.active { font-weight: 600; }
        .badge-warn { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; border-radius: 4px; padding: 4px 8px; }
        table.w-100 td, table.w-100 th { overflow: hidden; }
        #detailsTable, #combosTable { table-layout: fixed; }
        .ellipsis-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
        .nowrap { white-space: nowrap; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container" style="max-width: 1800px;">
        <span class="navbar-brand">个税填报服务</span>
    </div>
</nav>

<div class="container py-3" style="max-width: 1800px;">
<div class="d-flex gap-2 mb-3 flex-wrap">
        <a href="/" class="btn btn-outline-primary">报税数据生成</a>
        <a href="/tax-return" class="btn btn-primary active">报税状态统计</a>
        <a href="/payroll-records" class="btn btn-outline-primary">工资发放情况查询</a>
        <a href="/personnel-compare" class="btn btn-outline-success">增减员比对</a>
        <a href="/special-units" class="btn btn-outline-primary">特殊结算单元配置</a>
    </div>
    <div class="card">
        <div class="card-header"><strong>回盘数据导入</strong></div>
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">回盘文件（税务局个税端导出 xls/xlsx/csv）</label>
                    <input type="file" id="returnFile" class="form-control" accept=".xls,.xlsx,.csv">
                </div>
                <div class="col-md-2">
                    <button id="btnImport" class="btn btn-primary w-100">导入回盘数据</button>
                </div>
                <div class="col-md-4">
                    <span id="importMsg" class="badge-warn"></span>
                </div>
            </div>
            <div class="mt-3 row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">统计月份（发放月份/回盘税款所属期）</label>
                    <select id="monthSelect" class="form-select">
                        <option value="">请选择月份</option>
                    </select>
                    <div class="form-text">月份来自个税端回盘数据的"税款所属期起"，与系统发放月份对应；若回盘月份与系统发放月份不一致请核对</div>
                </div>
                <div class="col-md-2">
                    <button id="btnQuery" class="btn btn-outline-primary w-100">查询统计</button>
                </div>
                <div class="col-md-2">
                    <button id="btnExport" class="btn btn-outline-success w-100">导出统计Excel</button>
                </div>
            </div>
        </div>
    </div>

    <div id="statsCard" class="card" style="display:none;">
        <div class="card-header"><strong>报税状态概览（<span id="statMonth"></span>）</strong></div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-2 col-sm-4 stat-card"><div class="stat-info num" id="statTotal">0</div><div class="text-muted">系统应报人数</div></div>
                <div class="col-md-2 col-sm-4 stat-card"><div class="stat-ok num" id="statReported">0</div><div class="text-muted">已报送</div></div>
                <div class="col-md-2 col-sm-4 stat-card"><div class="stat-warn num" id="statDiff">0</div><div class="text-muted">个税有差异</div></div>
                <div class="col-md-2 col-sm-4 stat-card"><div class="stat-danger num" id="statUnreported">0</div><div class="text-muted">未报送</div></div>
                <div class="col-md-2 col-sm-4 stat-card"><div class="stat-info num" id="statNoSys">0</div><div class="text-muted">系统无记录(回盘)</div></div>
            </div>
        </div>
    </div>

    <div id="combosCard" class="card" style="display:none;">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <strong>按结算单元·所属月份·批次报送情况</strong>
            <div class="d-flex gap-2">
                <select id="comboStatusFilter" class="form-select form-select-sm" style="width:auto;">
                    <option value="">全部状态</option>
                    <option value="all">全部报送</option>
                    <option value="partial">部分报送</option>
                    <option value="none">全部未报送</option>
                </select>
                <input type="text" id="comboSearch" class="form-control form-control-sm" placeholder="名称/ID模糊搜索" style="width:200px;">
                <button id="comboFilterBtn" class="btn btn-sm btn-outline-primary">筛选</button>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm table-striped table-hover mb-0 w-100" id="combosTable">
                    <thead class="sticky-top">
                        <tr>
                            <th style="width:50px">序号</th><th>结算单元名称</th><th style="width:90px">结算单元ID</th><th style="width:80px">所属月份</th><th style="width:60px">批次</th>
                            <th style="width:70px">人数</th><th style="width:70px">已报送</th><th style="width:70px">未报送</th><th style="width:90px">状态</th>
                        </tr>
                    </thead>
                    <tbody id="combosTbody"></tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2">
                <span id="combosCount" class="text-muted"></span>
                <div class="d-flex gap-2 align-items-center">
                    <label class="form-label mb-0 small">每页</label>
                    <select id="combosPageSize" class="form-select form-select-sm" style="width:auto;">
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                        <option value="500" selected>500</option>
                        <option value="custom">自定义</option>
                    </select>
                    <input type="number" id="combosPageSizeCustom" class="form-control form-control-sm" style="width:80px; display:none;" min="1" placeholder="条数">
                    <button id="combosPrev" class="btn btn-sm btn-outline-secondary">上一页</button>
                    <span class="small" id="combosPageInfo"></span>
                    <button id="combosNext" class="btn btn-sm btn-outline-secondary">下一页</button>
                    <input type="number" id="combosJump" class="form-control form-control-sm" style="width:70px" min="1" placeholder="页码">
                    <button id="combosJumpBtn" class="btn btn-sm btn-outline-primary">跳页</button>
                </div>
            </div>
        </div>
    </div>

    <div id="detailsCard" class="card" style="display:none;">
        <div class="card-header d-flex justify-content-between align-items-center">
            <strong>按个人·月份报送明细</strong>
            <div class="d-flex gap-2">
                <select id="statusFilter" class="form-select form-select-sm" style="width:auto;">
                    <option value="">全部状态</option>
                    <option value="已报送">已报送</option>
                    <option value="有差异">有差异</option>
                    <option value="未报送">未报送</option>
                    <option value="系统无记录">系统无记录</option>
                </select>
                <input type="text" id="nameFilter" class="form-control form-control-sm" placeholder="姓名/证件号" style="width:auto;">
                <button id="btnFilter" class="btn btn-sm btn-outline-primary">筛选</button>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm table-striped table-hover mb-0 w-100" id="detailsTable">
                    <thead class="sticky-top">
                        <tr>
                            <th style="width:40px"></th><th style="width:50px">序号</th><th style="width:80px">姓名</th><th style="width:190px">证件号码</th><th>结算单元</th><th>所属月份-批次</th><th style="width:80px">月份</th>
                            <th style="width:110px">系统本期收入</th><th style="width:110px">回盘本期收入</th><th style="width:90px">收入差异</th>
                            <th style="width:100px">系统预算个税</th><th style="width:110px">回盘个税(应补退)</th>
                            <th style="width:90px">个税差值</th><th style="width:80px">状态</th>
                        </tr>
                    </thead>
                    <tbody id="detailsTbody"></tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2">
                <span id="detailsCount" class="text-muted"></span>
                <div class="d-flex gap-2 align-items-center">
                    <label class="form-label mb-0 small">每页</label>
                    <select id="detailsPageSize" class="form-select form-select-sm" style="width:auto;">
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                        <option value="500" selected>500</option>
                        <option value="custom">自定义</option>
                    </select>
                    <input type="number" id="detailsPageSizeCustom" class="form-control form-control-sm" style="width:80px; display:none;" min="1" placeholder="条数">
                    <button id="detailsPrev" class="btn btn-sm btn-outline-secondary">上一页</button>
                    <span class="small" id="detailsPageInfo"></span>
                    <button id="detailsNext" class="btn btn-sm btn-outline-secondary">下一页</button>
                    <input type="number" id="detailsJump" class="form-control form-control-sm" style="width:70px" min="1" placeholder="页码">
                    <button id="detailsJumpBtn" class="btn btn-sm btn-outline-primary">跳页</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const monthSelect = document.getElementById('monthSelect');
    const returnFile = document.getElementById('returnFile');
    const importMsg = document.getElementById('importMsg');
    let currentMonth = 0;

    document.addEventListener('DOMContentLoaded', loadMonths);

    async function loadMonths() {
        try {
            const resp = await fetch('/api/pay-months');
            const months = await resp.json();
            monthSelect.innerHTML = '<option value="">请选择月份</option>' +
                months.map(m => `<option value="${m.value}">${m.label}</option>`).join('');
        } catch (e) {
            console.error(e);
        }
    }

    document.getElementById('btnImport').addEventListener('click', async () => {
        if (!returnFile.files[0]) { importMsg.textContent = '请先选择回盘文件'; return; }
        const fd = new FormData();
        fd.append('file', returnFile.files[0]);
        importMsg.textContent = '导入中...';
        try {
            const resp = await fetch('/api/tax-return/import', { method: 'POST', body: fd });
            const data = await resp.json();
            if (data.error) { importMsg.textContent = '导入失败: ' + data.error; return; }
            importMsg.textContent = `导入成功 ${data.count} 条，回盘税款所属期: ${data.months.join(', ')}`;
            returnFile.value = '';
        } catch (e) {
            importMsg.textContent = '导入失败: ' + e.message;
        }
    });

    document.getElementById('btnQuery').addEventListener('click', queryStats);
    document.getElementById('btnExport').addEventListener('click', async () => {
        if (!currentMonth) return;
        const resp = await fetch(`/api/tax-return/export?month=${currentMonth}`);
        const data = await resp.json();
        if (data.download_url) window.location.href = data.download_url;
        else alert(data.error || '导出失败');
    });
    document.getElementById('btnFilter').addEventListener('click', () => { detailsPage = 1; queryDetails(); });

    let combosData = [];
    let combosFiltered = [];
    let detailsTotal = 0;
    let combosPage = 1;
    let detailsPage = 1;
    let detailsLoading = false;

    function pageSize(prefix) {
        const sel = document.getElementById(prefix + 'PageSize');
        if (sel.value === 'custom') {
            const v = parseInt(document.getElementById(prefix + 'PageSizeCustom').value);
            return v > 0 ? v : 50;
        }
        return parseInt(sel.value);
    }

    function toggleCustomInput(prefix) {
        const sel = document.getElementById(prefix + 'PageSize');
        document.getElementById(prefix + 'PageSizeCustom').style.display = sel.value === 'custom' ? 'inline-block' : 'none';
    }

    function bindPageSize(prefix, resetFn) {
        document.getElementById(prefix + 'PageSize').addEventListener('change', function () {
            toggleCustomInput(prefix);
            resetFn(1);
        });
        document.getElementById(prefix + 'PageSizeCustom').addEventListener('change', function () {
            resetFn(1);
        });
    }

    document.getElementById('combosPrev').addEventListener('click', () => { if (combosPage > 1) { combosPage--; renderCombos(); } });
    document.getElementById('combosNext').addEventListener('click', () => { if (combosPage * pageSize('combos') < combosFiltered.length) { combosPage++; renderCombos(); } });
    document.getElementById('detailsPrev').addEventListener('click', () => { if (detailsPage > 1) { detailsPage--; queryDetails(); } });
    document.getElementById('detailsNext').addEventListener('click', () => { if (detailsPage * pageSize('details') < detailsTotal) { detailsPage++; queryDetails(); } });
    document.getElementById('combosJumpBtn').addEventListener('click', () => jumpPage('combos'));
    document.getElementById('detailsJumpBtn').addEventListener('click', () => jumpPage('details'));
    document.getElementById('comboFilterBtn').addEventListener('click', filterCombos);
    document.getElementById('comboSearch').addEventListener('keydown', e => { if (e.key === 'Enter') filterCombos(); });
    bindPageSize('combos', p => { combosPage = p; renderCombos(); });
    bindPageSize('details', p => { detailsPage = p; queryDetails(); });

    function filterCombos() {
        const st = document.getElementById('comboStatusFilter').value;
        const kw = document.getElementById('comboSearch').value.trim().toLowerCase();
        combosFiltered = combosData.filter(c => {
            if (st === 'all' && c.unreported !== 0) return false;
            if (st === 'partial' && !(c.reported > 0 && c.unreported > 0)) return false;
            if (st === 'none' && c.reported !== 0) return false;
            if (kw) {
                const name = (c.unit_name || '').toLowerCase();
                const id = String(c.unit);
                if (!name.includes(kw) && !id.includes(kw)) return false;
            }
            return true;
        });
        combosPage = 1;
        renderCombos();
    }

    function jumpPage(prefix) {
        if (prefix === 'combos') {
            const totalPages = Math.max(1, Math.ceil(combosFiltered.length / pageSize('combos')));
            const p = parseInt(document.getElementById('combosJump').value);
            if (!p || p < 1 || p > totalPages) { alert(`页码需在 1-${totalPages} 之间`); return; }
            combosPage = p;
            renderCombos();
        } else {
            const totalPages = Math.max(1, Math.ceil(detailsTotal / pageSize('details')));
            const p = parseInt(document.getElementById('detailsJump').value);
            if (!p || p < 1 || p > totalPages) { alert(`页码需在 1-${totalPages} 之间`); return; }
            detailsPage = p;
            queryDetails();
        }
    }

    async function queryStats() {
        currentMonth = parseInt(monthSelect.value);
        if (!currentMonth) { alert('请选择月份'); return; }
        const btn = document.getElementById('btnQuery');
        btn.disabled = true;
        btn.textContent = '查询中...';
        try {
            const resp = await fetch(`/api/tax-return/status?month=${currentMonth}`);
            const data = await resp.json();
            if (data.error) { alert(data.error); return; }
            document.getElementById('statMonth').textContent = currentMonth;
            document.getElementById('statTotal').textContent = data.total;
            document.getElementById('statReported').textContent = data.reported;
            document.getElementById('statDiff').textContent = data.diff;
            document.getElementById('statUnreported').textContent = data.unreported;
            document.getElementById('statNoSys').textContent = data.no_sys;
            document.getElementById('statsCard').style.display = 'block';

            combosData = data.combos;
            combosFiltered = data.combos;
            combosPage = 1;
            renderCombos();
            document.getElementById('combosCard').style.display = 'block';
            detailsPage = 1;
            await queryDetails();
        } finally {
            btn.disabled = false;
            btn.textContent = '查询统计';
        }
    }

    function renderCombos() {
        const comboStatus = c => c.unreported === 0 ? '<span class="status-ok">全部报送</span>' :
            c.reported === 0 ? '<span class="status-no">全部未报送</span>' : '<span class="status-diff">部分报送</span>';
        const ps = pageSize('combos');
        const totalPages = Math.max(1, Math.ceil(combosFiltered.length / ps));
        if (combosPage > totalPages) combosPage = totalPages;
        const start = (combosPage - 1) * ps;
        const page = combosFiltered.slice(start, start + ps);
        document.getElementById('combosTbody').innerHTML = page.map((c, i) => `
            <tr>
                <td>${start + i + 1}</td><td class="ellipsis-cell" title="${(c.unit_name || '').replace(/"/g, '&quot;')}">${c.unit_name || c.unit}</td><td>${c.unit}</td><td>${c.month}</td><td>${c.seq}</td>
                <td>${c.count}</td><td class="status-ok">${c.reported}</td><td class="status-no">${c.unreported}</td>
                <td>${comboStatus(c)}</td>
            </tr>`).join('');
        document.getElementById('combosCount').textContent = `共 ${combosFiltered.length} 条`;
        document.getElementById('combosPageInfo').textContent = `第 ${combosPage}/${totalPages} 页`;
        document.getElementById('combosPrev').disabled = combosPage <= 1;
        document.getElementById('combosNext').disabled = combosPage * ps >= combosFiltered.length;
    }

    async function queryDetails() {
        if (!currentMonth || detailsLoading) return;
        detailsLoading = true;
        const status = document.getElementById('statusFilter').value;
        const name = document.getElementById('nameFilter').value.trim();
        const ps = pageSize('details');
        const url = `/api/tax-return/details?month=${currentMonth}&page=${detailsPage}&page_size=${ps}` +
            (status ? '&status=' + encodeURIComponent(status) : '') +
            (name ? '&search=' + encodeURIComponent(name) : '');
        const tbody = document.getElementById('detailsTbody');
        tbody.innerHTML = '<tr><td colspan="12" class="text-center text-muted py-3">加载中...</td></tr>';
        try {
            const resp = await fetch(url);
            const data = await resp.json();
            if (data.error) return;
            detailsTotal = data.total;
            renderDetails(data.details);
        } finally {
            detailsLoading = false;
        }
        document.getElementById('detailsCard').style.display = 'block';
    }

    function renderDetails(pageData) {
        const cls = { '已报送': 'status-ok', '有差异': 'status-diff', '未报送': 'status-no', '系统无记录': 'status-other' };
        const ps = pageSize('details');
        const totalPages = Math.max(1, Math.ceil(detailsTotal / ps));
        const start = (detailsPage - 1) * ps;
        document.getElementById('detailsTbody').innerHTML = pageData.map((d, i) => {
            const hasMulti = d.entries && d.entries.length > 1;
            const expandBtn = hasMulti
                ? `<button class="btn btn-sm btn-outline-primary py-0 px-1" onclick="toggleEntry(this)" title="展开多笔工资明细">+</button>`
                : '';
            const subRows = hasMulti ? d.entries.map(e => `
                <tr class="entry-sub" style="display:none; background:#f8f9fa;">
                    <td></td><td colspan="2"></td>
                    <td>${e.unit_name}</td><td>${e.month}-批${e.seq}</td><td colspan="8" style="text-align:left;">
                        本期收入 ${e.income.toLocaleString()} 元，预算个税 ${e.tax.toLocaleString()} 元
                    </td>
                </tr>`).join('') : '';
            return `
            <tr class="entry-row">
                <td>${expandBtn}</td>
                <td>${start + i + 1}</td><td>${d.name}</td><td class="nowrap">${d.cert_no}</td><td class="ellipsis-cell" title="${(d.unit_name || '').replace(/"/g, '&quot;')}">${d.unit_name || ''}</td><td class="ellipsis-cell" title="${(d.unit_periods || '').replace(/"/g, '&quot;')}">${d.unit_periods || ''}</td><td>${d.month}</td>
                <td>${d.sys_income ?? ''}</td><td>${d.ret_income ?? ''}</td><td>${d.income_diff ?? ''}</td>
                <td>${d.sys_tax ?? ''}</td><td>${d.ret_tax ?? ''}</td>
                <td>${d.diff ?? ''}</td>
                <td class="${cls[d.status] || ''}">${d.status}</td>
            </tr>${subRows}`;
        }).join('');
        document.getElementById('detailsCount').textContent = `共 ${detailsTotal} 条`;
        document.getElementById('detailsPageInfo').textContent = `第 ${detailsPage}/${totalPages} 页`;
        document.getElementById('detailsPrev').disabled = detailsPage <= 1;
        document.getElementById('detailsNext').disabled = detailsPage * ps >= detailsTotal;
    }

    function toggleEntry(btn) {
        const row = btn.closest('tr');
        let sub = row.nextElementSibling;
        let shown = false;
        while (sub && sub.classList.contains('entry-sub')) {
            sub.style.display = sub.style.display === 'none' ? 'table-row' : 'none';
            shown = shown || sub.style.display === 'table-row';
            sub = sub.nextElementSibling;
        }
        btn.textContent = shown ? '-' : '+';
        btn.title = shown ? '收起' : '展开多笔工资明细';
    }
</script>
</body>
</html>
